<title>死角トレーニング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: full-screen first-person pitch, HUD floats at the edges (single dark look, like a stadium at night) */
:root {
  --pitch: #0e2a1c;
  --ink: #f2f7ef;
  --ink-dim: #b9cdbf;
  --panel: rgba(8, 22, 15, 0.84);
  --card: #12301f;
  --line: #3c6b52;
  --accent: #ffd23f;
  --opp: #e2474b;
  --mate: #3d8bff;
  --good: #5ee08a;
  --mid: #ffd23f;
  --bad: #ff7a6e;
  --font: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; overflow: hidden; background: var(--pitch); color: var(--ink);
  font-family: var(--font); touch-action: none; user-select: none; -webkit-user-select: none;
}
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.hud-top {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px);
  left: calc(env(safe-area-inset-left, 0px) + 12px);
  right: calc(env(safe-area-inset-right, 0px) + 12px);
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none;
}
.hud-top .stack { display: grid; gap: 6px; justify-items: start; }
.tag {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  padding: 6px 10px; font-size: 13px; line-height: 1.4; max-width: 60ch;
}
.tag b { color: var(--accent); font-weight: 800; }
#mic.on b { color: var(--good); }
#heard { font-size: 15px; font-weight: 800; }
.btn {
  pointer-events: auto; font: inherit; font-weight: 800; font-size: 14px; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer;
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: #1b1600; border-color: var(--accent); }
.btn.sel { border-color: var(--accent); color: var(--accent); }

#minimap {
  position: fixed; right: calc(env(safe-area-inset-right, 0px) + 12px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  width: 170px; height: 150px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
}
#joyBase, #joyKnob { position: fixed; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); }
#joyBase { width: 120px; height: 120px; border: 2px solid rgba(242,247,239,.35); background: rgba(8,22,15,.35); }
#joyKnob { width: 52px; height: 52px; background: rgba(255,210,63,.85); }
.hint {
  position: fixed; left: calc(env(safe-area-inset-left, 0px) + 12px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  font-size: 12px; color: var(--ink-dim); background: var(--panel); border-radius: 8px; padding: 5px 9px; pointer-events: none;
}
#calls {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); display: flex; gap: 10px;
}
#calls .btn { font-size: 18px; padding: 12px 20px; }
#banner {
  position: fixed; left: 50%; top: 22%; transform: translateX(-50%);
  font-size: 34px; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,.6); pointer-events: none; white-space: nowrap;
}

.overlay {
  position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; overflow-y: auto;
  background: rgba(6, 18, 12, 0.88);
}
.card {
  max-width: 520px; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 22px 20px; display: grid; gap: 14px;
}
.card h1, .card h2 { margin: 0; font-weight: 800; text-wrap: balance; }
.card h1 { font-size: 26px; }
.card h1 span { color: var(--accent); }
.card h2 { font-size: 22px; }
.card p { margin: 0; font-size: 14px; line-height: 1.7; color: var(--ink-dim); }
.card ul { margin: 0; padding-left: 1.2em; font-size: 14px; line-height: 1.8; }
.card .say { color: var(--accent); font-weight: 800; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .btn { flex: 1 1 140px; padding: 12px; font-size: 16px; }
.levels { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 14px; }
.levels .btn { padding: 6px 12px; }
#note { font-size: 13px; color: var(--accent); min-height: 1em; }

#result .card { max-width: 640px; }
.res-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 560px) { .res-grid { grid-template-columns: minmax(0, 1fr); } }
#replay { width: 100%; aspect-ratio: 4 / 3.4; max-width: 100%; border-radius: 10px; border: 1px solid var(--line); background: #0b2216; }
.items { display: grid; gap: 8px; align-content: start; }
.item { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); gap: 8px; align-items: start; font-size: 14px; line-height: 1.5; }
.mark { font-size: 20px; font-weight: 800; text-align: center; line-height: 1.2; }
.mark.g { color: var(--good); } .mark.m { color: var(--mid); } .mark.b { color: var(--bad); }
.item small { display: block; color: var(--ink-dim); font-size: 12.5px; }
.tally { font-size: 13px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.drills { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.drills .btn { padding: 10px 6px; font-size: 14px; line-height: 1.3; }
.drills .btn small { display: block; font-size: 11.5px; font-weight: 500; color: var(--ink-dim); }
.drills .btn.sel small { color: var(--accent); }
.bar { display: inline-block; width: 110px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.15); vertical-align: middle; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--good); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<canvas id="view"></canvas>

<div class="hud-top">
  <div class="stack">
    <div class="tag" id="task"><b>ワンサイドカット</b>　首を振って、危ない受け手へのパスコースを切りながら寄せよう</div>
    <div class="tag" id="mic"><b>声：</b><span id="micText">準備中</span></div>
    <div class="tag" id="heard" hidden></div>
    <div class="tag" id="meter" hidden><span id="meterBar"><b>マーク確認</b> <span class="bar"><i id="meterFill"></i></span>　</span><span id="meterTime"></span></div>
  </div>
  <div class="stack" style="justify-items:end">
    <button class="btn" id="recenter" type="button">正面に戻す</button>
    <div class="tag tally" id="tally">0本中 0本成功</div>
  </div>
</div>
<div id="banner" hidden></div>
<canvas id="minimap" width="340" height="300"></canvas>
<div class="hint" id="hint">左でスティック移動 ・ 右をドラッグで見回す</div>
<div id="calls" hidden>
  <button class="btn" type="button" data-call="L">左いけ！</button>
  <button class="btn" type="button" data-call="R">右いけ！</button>
</div>
<div id="joyBase" hidden></div>
<div id="joyKnob" hidden></div>

<div id="start" class="overlay">
  <div class="card">
    <h1>死角<span>トレーニング</span></h1>
    <div class="drills" role="group" aria-label="ドリルを選ぶ">
      <button class="btn sel" type="button" data-drill="cut">ワンサイドカット<small>守備・声の指示</small></button>
      <button class="btn" type="button" data-drill="mark">マークを外さない<small>守備・首振り</small></button>
      <button class="btn" type="button" data-drill="run">背後へ飛び出す<small>攻撃・視線の外</small></button>
    </div>
    <p id="lead"></p>
    <ul id="intro"></ul>
    <div class="levels">レベル
      <button class="btn sel" type="button" data-level="1">1</button>
      <button class="btn" type="button" data-level="2">2</button>
      <button class="btn" type="button" data-level="3">3</button>
      <span id="levelNote" style="color:var(--ink-dim)">危ない受け手に印が出る・相手はゆっくり</span>
    </div>
    <div class="row">
      <button class="btn primary" id="startGyro" type="button">ジャイロで始める</button>
      <button class="btn" id="startTouch" type="button">タッチ操作で始める</button>
    </div>
    <div id="note"></div>
  </div>
</div>

<div id="result" class="overlay" hidden>
  <div class="card">
    <h2 id="resTitle">結果</h2>
    <p id="resWhy"></p>
    <div class="res-grid">
      <canvas id="replay" width="560" height="476"></canvas>
      <div class="items" id="items"></div>
    </div>
    <div class="row">
      <button class="btn primary" id="next" type="button">次の1本</button>
      <button class="btn" id="toMenu" type="button">ドリル・レベルを変える</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const deg = Math.PI / 180;

  // ---------- scene ----------
  const canvas = $('view');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9fc7e8);
  scene.fog = new THREE.Fog(0x9fc7e8, 40, 110);
  const camera = new THREE.PerspectiveCamera(70, 1, 0.05, 200);
  const EYE = 1.4; // 10歳の目の高さ（m）

  scene.add(new THREE.HemisphereLight(0xffffff, 0x2a5a2a, 0.9));
  const sun = new THREE.DirectionalLight(0xffffff, 0.6);
  sun.position.set(10, 30, 10);
  scene.add(sun);

  // coordinate system: +z is toward the goal at z = 26. yaw 0 = facing +z
  const FW = 68, FL = 52;
  const tex = (() => {
    const c = document.createElement('canvas'); c.width = 1024; c.height = 784;
    const g = c.getContext('2d'), sx = c.width / FW, sz = c.height / FL;
    for (let i = 0; i < 13; i++) { g.fillStyle = i % 2 ? '#2f7a32' : '#378636'; g.fillRect(0, i * c.height / 13, c.width, c.height / 13 + 1); }
    g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 4;
    const X = x => (x + FW / 2) * sx, Z = z => (z + FL / 2) * sz;
    g.strokeRect(X(-FW / 2) + 2, Z(-FL / 2) + 2, FW * sx - 4, FL * sz - 4);
    g.strokeRect(X(-20.15), Z(26 - 16.5), 40.3 * sx, 16.5 * sz);   // penalty area
    g.strokeRect(X(-9.15), Z(26 - 5.5), 18.3 * sx, 5.5 * sz);      // goal area
    g.beginPath(); g.arc(X(0), Z(26 - 11), 3, 0, Math.PI * 2); g.fillStyle = '#fff'; g.fill();
    g.beginPath(); g.arc(X(0), Z(-26), 9.15 * sx, 0, Math.PI); g.stroke();
    const t = new THREE.CanvasTexture(c); t.anisotropy = 8; return t;
  })();
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(FW, FL), new THREE.MeshLambertMaterial({ map: tex }));
  ground.rotation.x = -Math.PI / 2; scene.add(ground);
  const outer = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshLambertMaterial({ color: 0x2c6a2e }));
  outer.rotation.x = -Math.PI / 2; outer.position.y = -0.01; scene.add(outer);
  (() => {
    const m = new THREE.MeshLambertMaterial({ color: 0xffffff });
    const post = new THREE.CylinderGeometry(0.06, 0.06, 2.44, 10);
    [-3.66, 3.66].forEach(x => { const p = new THREE.Mesh(post, m); p.position.set(x, 1.22, 26); scene.add(p); });
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 7.32, 10), m);
    bar.rotation.z = Math.PI / 2; bar.position.set(0, 2.44, 26); scene.add(bar);
    const net = new THREE.Mesh(new THREE.PlaneGeometry(7.32, 2.44), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.18, side: THREE.DoubleSide }));
    net.position.set(0, 1.22, 27.5); scene.add(net);
  })();

  // ---------- players ----------
  // The same four figures are re-cast for each drill (colour, name tag, who is on the pitch)
  const RED = 0xe2474b, RED_T = '#ff8f8f', BLUE = 0x3d8bff, BLUE_T = '#9cc4ff';
  function label(text, color) {
    const c = document.createElement('canvas'); c.width = 256; c.height = 64;
    const g = c.getContext('2d');
    g.fillStyle = 'rgba(0,0,0,.55)'; g.beginPath(); g.roundRect ? g.roundRect(8, 8, 240, 48, 14) : g.rect(8, 8, 240, 48); g.fill();
    g.fillStyle = color; g.font = 'bold 30px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 128, 33);
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
    s.scale.set(1.8, 0.45, 1); return s;
  }
  function makePlayer() {
    const g = new THREE.Group();
    const skin = new THREE.MeshLambertMaterial({ color: 0xe9c29b });
    const shirtMat = new THREE.MeshLambertMaterial({ color: RED });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.17, 0.62, 14), shirtMat);
    body.position.y = 1.0; g.add(body);
    const shorts = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.2, 14), new THREE.MeshLambertMaterial({ color: 0x1d1d1d }));
    shorts.position.y = 0.62; g.add(shorts);
    const legs = [-0.08, 0.08].map(x => {
      const pivot = new THREE.Group(); pivot.position.set(x, 0.55, 0); g.add(pivot);
      const l = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.55, 8), skin); l.position.y = -0.27; pivot.add(l);
      return pivot;
    });
    const head = new THREE.Group(); head.position.y = 1.47; g.add(head);
    head.add(new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 12), skin));
    const eyes = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.04, 0.04), new THREE.MeshBasicMaterial({ color: 0x111111 }));
    eyes.position.set(0, 0.02, 0.12); head.add(eyes);
    const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.32, 20), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 }));
    shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.01; g.add(shadow);
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.55, 0.7, 32), new THREE.MeshBasicMaterial({ color: 0xffd23f, transparent: true, opacity: 0.85 }));
    ring.rotation.x = -Math.PI / 2; ring.position.y = 0.02; ring.visible = false; g.add(ring);
    scene.add(g);
    return { g, head, legs, ring, shirtMat, tag: null, pos: new THREE.Vector3(), facing: 0, headYaw: 0, active: true };
  }
  function setRole(p, shirt, text, textColor) {
    p.shirtMat.color.setHex(shirt);
    if (p.tag) { p.g.remove(p.tag); p.tag.material.map.dispose(); p.tag.material.dispose(); }
    p.tag = label(text, textColor); p.tag.position.y = 1.95; p.g.add(p.tag);
    p.active = true; p.g.visible = true; p.ring.visible = false;
    p.legs[1].rotation.x = 0; p.facing = 0; p.headYaw = 0;
  }
  function bench(p) { p.active = false; p.g.visible = false; p.pos.set(0, 0, 300); }
  const holder = makePlayer();
  const recv = { L: makePlayer(), R: makePlayer() };
  const mate = makePlayer();
  const others = [holder, recv.L, recv.R, mate];
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.11, 18, 14), new THREE.MeshLambertMaterial({ color: 0xffffff }));
  scene.add(ball);

  const me = { pos: new THREE.Vector3(0, 0, 6), vel: new THREE.Vector3() };
  const MAX_SPEED = 4.6; // m/s

  // ---------- look: gyro or drag ----------
  let mode = 'touch', devOri = null, yawOffset = 0, dragPitch = -0.08, needsRecenter = true;
  const zee = new THREE.Vector3(0, 0, 1), yAxis = new THREE.Vector3(0, 1, 0);
  const euler = new THREE.Euler(), q0 = new THREE.Quaternion(), qYaw = new THREE.Quaternion();
  const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
  function screenAngle() {
    if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle * deg;
    return (window.orientation || 0) * deg;
  }
  function onOri(e) { if (e.alpha !== null) devOri = e; }
  // look yaw: 0 = looking toward -z
  function cameraYaw() {
    const d = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    return Math.atan2(-d.x, -d.z);
  }
  function yawTo(p) { return Math.atan2(-(p.x - me.pos.x), -(p.z - me.pos.z)); }
  function applyLook() {
    if (mode === 'gyro' && devOri) {
      euler.set(devOri.beta * deg, devOri.alpha * deg, -devOri.gamma * deg, 'YXZ');
      camera.quaternion.setFromEuler(euler);
      camera.quaternion.multiply(q1);
      camera.quaternion.multiply(q0.setFromAxisAngle(zee, -screenAngle()));
      if (needsRecenter) { yawOffset = -cameraYaw() + yawTo(holder.pos); needsRecenter = false; }
      qYaw.setFromAxisAngle(yAxis, yawOffset);
      camera.quaternion.premultiply(qYaw);
    } else {
      if (needsRecenter) { yawOffset = yawTo(holder.pos); dragPitch = -0.08; needsRecenter = false; }
      camera.quaternion.setFromEuler(new THREE.Euler(dragPitch, yawOffset, 0, 'YXZ'));
    }
  }
  const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const flatDist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
  // facing angle of the other players: they face (sin f, cos f)
  const angTo = (a, b) => Math.atan2(b.x - a.x, b.z - a.z);
  const turnToward = (a, b, step) => { const d = wrap(b - a); return Math.abs(d) <= step ? b : a + Math.sign(d) * step; };
  function moveTo(p, x, z, step) {
    const dx = x - p.x, dz = z - p.z, L = Math.hypot(dx, dz);
    if (L <= step) { p.x = x; p.z = z; } else { p.x += dx / L * step; p.z += dz / L * step; }
  }
  const inMyView = (p, half) => Math.abs(wrap(yawTo(p) - cameraYaw())) < half;

  // ---------- input ----------
  const joy = { id: null, ox: 0, oy: 0, x: 0, y: 0 }, drag = { id: null, lx: 0, ly: 0 };
  const joyBase = $('joyBase'), joyKnob = $('joyKnob'), JR = 60;
  function setJoy(px, py) {
    let dx = px - joy.ox, dy = py - joy.oy; const L = Math.hypot(dx, dy);
    if (L > JR) { dx *= JR / L; dy *= JR / L; }
    joy.x = dx / JR; joy.y = dy / JR;
    joyKnob.style.left = (joy.ox + dx) + 'px'; joyKnob.style.top = (joy.oy + dy) + 'px';
  }
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    if (e.clientX < innerWidth * 0.45 && joy.id === null) {
      joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY;
      joyBase.style.left = e.clientX + 'px'; joyBase.style.top = e.clientY + 'px';
      joyBase.hidden = joyKnob.hidden = false; setJoy(e.clientX, e.clientY);
    } else if (drag.id === null) { drag.id = e.pointerId; drag.lx = e.clientX; drag.ly = e.clientY; }
  });
  canvas.addEventListener('pointermove', e => {
    if (e.pointerId === joy.id) setJoy(e.clientX, e.clientY);
    else if (e.pointerId === drag.id) {
      yawOffset -= (e.clientX - drag.lx) * 0.006;
      if (mode !== 'gyro') dragPitch = Math.max(-1.2, Math.min(1.0, dragPitch - (e.clientY - drag.ly) * 0.004));
      drag.lx = e.clientX; drag.ly = e.clientY;
    }
  });
  const release = e => {
    if (e.pointerId === joy.id) { joy.id = null; joy.x = joy.y = 0; joyBase.hidden = joyKnob.hidden = true; }
    if (e.pointerId === drag.id) drag.id = null;
  };
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  const keys = {};
  addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'KeyQ') makeCall('L', 'キー'); if (e.code === 'KeyE') makeCall('R', 'キー');
  });
  addEventListener('keyup', e => { keys[e.code] = false; });
  $('recenter').addEventListener('click', () => { needsRecenter = true; });

  // ---------- voice ----------
  // The teammate goes to the side you name: 「左いけ！」→ 味方が左の受け手へ
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, voiceOn = false, voiceFallback = false;
  function setMic(text, on) { $('micText').textContent = text; $('mic').classList.toggle('on', !!on); }
  function syncCalls() { $('calls').hidden = !(voiceFallback && drill.voice); }
  function showButtons() { voiceFallback = true; syncCalls(); }
  function parseSide(txt) {
    const l = /左|ひだり|レフト/.test(txt), r = /右|みぎ|ライト/.test(txt);
    if (l && !r) return 'L'; if (r && !l) return 'R'; return null;
  }
  let heardTimer = 0;
  function showHeard(txt) {
    $('heard').textContent = '聞こえた：「' + txt + '」'; $('heard').hidden = false;
    clearTimeout(heardTimer); heardTimer = setTimeout(() => { $('heard').hidden = true; }, 1800);
  }
  function startVoice() {
    if (!SR) { setMic('この画面では使えません。下のボタンで指示してね', false); showButtons(); return; }
    try {
      rec = new SR(); rec.lang = 'ja-JP'; rec.continuous = true; rec.interimResults = true;
      rec.onstart = () => { voiceOn = true; setMic('聞き取り中', true); };
      rec.onresult = e => {
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const txt = e.results[i][0].transcript.trim(); if (!txt) continue;
          showHeard(txt);
          const s = parseSide(txt); if (s) makeCall(s, '声');
        }
      };
      rec.onerror = e => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture') {
          voiceOn = false; setMic('マイクが使えません。下のボタンで指示してね', false); showButtons();
        }
      };
      rec.onend = () => { if (voiceOn) { try { rec.start(); } catch (_) {} } };
      rec.start();
      setTimeout(() => { if (!voiceOn) { setMic('マイクが使えません。下のボタンで指示してね', false); showButtons(); } }, 3000);
    } catch (_) { setMic('この画面では使えません。下のボタンで指示してね', false); showButtons(); }
  }
  document.querySelectorAll('#calls [data-call]').forEach(b => b.addEventListener('click', () => makeCall(b.dataset.call, 'ボタン')));

  // ---------- shared drill plumbing ----------
  // Each drill: start() sets up a rep, update(dt) runs it and calls finish(outcome),
  // items() grades it, outcome() explains it, snap() describes one top-view frame.
  let drillKey = 'cut', drill = null, level = 1, rep = null;
  const tally = { cut: { n: 0, ok: 0 }, mark: { n: 0, ok: 0 }, run: { n: 0, ok: 0 } };
  const VIEW = 35 * deg; // your central view: what counts as "checked"
  function baseRep(extra) { return Object.assign({ phase: 'live', t: 0, rec: [], recT: 0, outcome: null }, extra); }
  function showTally() { const t = tally[drillKey]; $('tally').textContent = `${t.n}本中 ${t.ok}本成功`; }
  let bannerT = 0;
  function banner(text, sec) { $('banner').textContent = text; $('banner').hidden = !text; bannerT = sec; }
  function finish(outcome) {
    rep.rec.push(snapshot());
    rep.outcome = outcome; rep.phase = 'ended';
    const win = drill.wins.includes(outcome);
    const t = tally[drillKey]; t.n++; if (win) t.ok++;
    showTally();
    banner(win ? 'ナイス！' : drill.failBanner, 1.0);
    setTimeout(showResult, 900);
  }
  function makeCall(s, by) {
    if (!rep || rep.phase === 'ended' || !drill.voice) return;
    if (rep.call === s) return;
    rep.call = s; rep.callT = rep.t; rep.callBy = by;
    banner(s === 'L' ? '味方→左！' : '味方→右！', 1.0);
  }
  const atFeet = (p, dist) => ball.position.set(p.pos.x + Math.sin(p.facing) * dist, 0.11, p.pos.z + Math.cos(p.facing) * dist);

  // ========== drill 1: one-side cut (defence, voice) ==========
  const CUT_LV = {
    1: { decide: 3.2, hint: true, note: '危ない受け手に印が出る・相手はゆっくり' },
    2: { decide: 2.5, hint: false, note: '印なし・相手の判断がふつう' },
    3: { decide: 1.8, hint: false, note: '印なし・相手の判断が速い' },
  };
  const BALL_TRAVEL = 1.3; // s, ball travelling to the holder before he can decide
  const sideJ = { L: '左', R: '右' };
  // distance from point p to segment a→b, and position t along it
  function segInfo(p, a, b) {
    const abx = b.x - a.x, abz = b.z - a.z, L2 = abx * abx + abz * abz;
    const t = ((p.x - a.x) * abx + (p.z - a.z) * abz) / L2;
    const cx = a.x + abx * t, cz = a.z + abz * t;
    return { t, d: Math.hypot(p.x - cx, p.z - cz) };
  }
  function laneBlockedByMe(s) { const i = segInfo(me.pos, holder.pos, recv[s].pos); return i.t > 0.02 && i.t < 0.5 && i.d < 0.95; }
  function markedByMate(s) { return mate.pos.distanceTo(recv[s].pos) < 2.2; }
  function laneOpen(s) { return !laneBlockedByMe(s) && !markedByMate(s); }
  const distToHolder = () => Math.hypot(me.pos.x - holder.pos.x, me.pos.z - holder.pos.z);
  const mySpeed = () => Math.hypot(me.vel.x, me.vel.z);

  const cut = {
    name: 'ワンサイドカット', task: '首を振って、危ない受け手へのパスコースを切りながら寄せよう', voice: true, levels: CUT_LV,
    lead: 'あなたはディフェンス。前の相手にボールが渡ります。左右に相手の受け手が2人、後ろに味方が1人います。',
    intro: [
      'ボールが来る前に首を振って、どっちの受け手が<b>危ないか</b>（前に出ている方）を見つけよう',
      'そっちへのパスコースを体で切りながら寄せよう（ワンサイドカット）',
      '反対側の受け手は味方にまかせる。声で <span class="say">「左いけ！」</span> <span class="say">「右いけ！」</span>',
      '寄せすぎて飛び込むと、かわされるよ',
    ],
    wins: ['intercept', 'mateCut', 'stuck'], failBanner: '通された…',
    replayWin: { x0: -14, x1: 14, z0: -10, z1: 14 }, mapWin: { x0: -16, x1: 16, z0: -12, z1: 16 },
    start() {
      setRole(holder, RED, '相手（ボール）', RED_T); setRole(recv.L, RED, '相手', RED_T); setRole(recv.R, RED, '相手', RED_T);
      setRole(mate, BLUE, '味方', BLUE_T);
      const side = Math.random() < 0.5 ? 'L' : 'R';
      const sx = { L: -1, R: 1 };
      rep = baseRep({
        phase: 'incoming', side, live: 0,
        decideAt: CUT_LV[level].decide * (0.85 + Math.random() * 0.3),
        call: null, callT: null, callBy: null,
        seen: { L: false, R: false, M: false }, seenBeforeBall: 0,
        decision: null, passTo: null, passT: 0, passFrom: null,
        nearSpeed: 0, distAtDecision: 0,
      });
      holder.pos.set(0, 0, -6); holder.facing = 0; holder.headYaw = 0;
      for (const s of ['L', 'R']) {
        const danger = s === side;
        recv[s].pos.set(sx[s] * (danger ? 10 : 12), 0, danger ? 0 : -3);
        recv[s].ring.visible = danger && CUT_LV[level].hint;
      }
      me.pos.set((Math.random() - 0.5) * 4, 0, 6.5); me.vel.set(0, 0, 0);
      mate.pos.set(-sx[side] * 3, 0, 5); mate.target = null;
      ball.position.set(0, 0.11, -24);
    },
    update(dt) {
      rep.t += dt;
      // what is in your central view (±30°) counts as "checked"
      const gy = cameraYaw();
      const inView = p => Math.abs(wrap(yawTo(p) - gy)) < 30 * deg;
      if (!rep.decision) {
        if (inView(recv.L.pos)) rep.seen.L = true;
        if (inView(recv.R.pos)) rep.seen.R = true;
        if (inView(mate.pos)) rep.seen.M = true;
      }

      // receivers: the dangerous one drifts forward into space
      if (!rep.decision) recv[rep.side].pos.z = Math.min(4, recv[rep.side].pos.z + dt * 0.6);
      for (const s of ['L', 'R']) { recv[s].facing = Math.atan2(holder.pos.x - recv[s].pos.x, holder.pos.z - recv[s].pos.z); recv[s].headYaw = 0; }

      // teammate: holds a covering spot until told, then goes to that receiver (goal side)
      if (rep.call) mate.target = new THREE.Vector3(recv[rep.call].pos.x * 0.92, 0, recv[rep.call].pos.z + 1.2);
      const mt = mate.target || new THREE.Vector3(me.pos.x * 0.4 + (rep.side === 'L' ? 3 : -3), 0, Math.min(me.pos.z + 2, 6));
      const mv = mt.clone().sub(mate.pos); const md = mv.length();
      if (md > 0.05) mate.pos.add(mv.multiplyScalar(Math.min(1, (mate.target ? 6 : 3) * dt / md)));
      mate.facing = Math.atan2(holder.pos.x - mate.pos.x, holder.pos.z - mate.pos.z); mate.headYaw = 0;

      if (rep.phase === 'incoming') {
        const k = Math.min(1, rep.t / BALL_TRAVEL);
        ball.position.set(0, 0.11, -24 + (holder.pos.z - 0.45 + 24) * k);
        holder.facing = Math.PI; holder.headYaw = 0.9 * Math.sin(rep.t * 3); // scanning before receiving
        if (k >= 1) { rep.phase = 'live'; rep.seenBeforeBall = rep.seen.L + rep.seen.R + rep.seen.M; }
      } else if (rep.phase === 'live') {
        rep.live += dt;
        holder.facing = wrap(holder.facing + wrap(0 - holder.facing) * Math.min(1, dt * 4));
        holder.headYaw = 0.8 * Math.sin(rep.live * 3.2);
        const d = distToHolder();
        holder.pos.z += (d < 3 ? 0.2 : 0.8) * dt;
        atFeet(holder, 0.45);
        if (d < 2.0) rep.nearSpeed = Math.max(rep.nearSpeed, mySpeed());
        if (rep.live >= rep.decideAt || d < 1.3) cutDecide();
      } else {
        rep.passT += dt;
        if (rep.phase === 'windup') {
          // kicking leg swings back: the same cue the 背後へ飛び出す drill trains you to read
          holder.legs[1].rotation.x = -0.9 * Math.min(1, rep.passT / 0.35);
          holder.facing = Math.atan2(recv[rep.passTo].pos.x - holder.pos.x, recv[rep.passTo].pos.z - holder.pos.z);
          holder.headYaw = 0;
          atFeet(holder, 0.45);
          if (rep.passT >= 0.35) { rep.phase = 'pass'; rep.passT = 0; rep.passFrom = ball.position.clone(); holder.legs[1].rotation.x = 0.6; }
        } else if (rep.phase === 'pass') {
          const target = recv[rep.passTo].pos, from = rep.passFrom;
          const L = Math.hypot(target.x - from.x, target.z - from.z), k = Math.min(1, rep.passT * 13 / L);
          ball.position.set(from.x + (target.x - from.x) * k, 0.11, from.z + (target.z - from.z) * k);
          if (Math.hypot(ball.position.x - me.pos.x, ball.position.z - me.pos.z) < 0.8) finish('intercept');
          else if (Math.hypot(ball.position.x - mate.pos.x, ball.position.z - mate.pos.z) < 0.9) finish('mateCut');
          else if (k >= 1) finish('passed');
        } else if (rep.phase === 'beaten') {
          const dir = Math.sign(holder.pos.x - me.pos.x) || 1;
          holder.pos.z += 4.5 * dt; holder.pos.x += dir * 2.5 * dt; holder.facing = 0.4 * dir;
          atFeet(holder, 0.6);
          if (rep.passT > 1.2) finish('beaten');
        } else if (rep.phase === 'stuck') {
          holder.pos.z -= 0.8 * dt; holder.facing = Math.PI; holder.headYaw = 0.9 * Math.sin(rep.passT * 6);
          atFeet(holder, 0.45);
          if (rep.passT > 1.2) finish('stuck');
        }
      }
    },
    items() {
      const r = rep, other = r.side === 'L' ? 'R' : 'L';
      const items = [];
      // 1. course cut
      const cutMine = r.decision && r.decision.blockedMe[r.side];
      const cutMate = r.decision && r.decision.marked[r.side];
      if (r.outcome === 'beaten') items.push(['b', 'コースを切る', '飛び込んでかわされた。2mまで来たらスピードを落として、半身で止まろう']);
      else if (cutMine) items.push(['g', 'コースを切る', `${sideJ[r.side]}の危ない受け手へのコースを体で消せた`]);
      else if (cutMate) items.push(['m', 'コースを切る', `${sideJ[r.side]}は味方が消してくれた。自分の体でも切れるとベスト`]);
      else items.push(['b', 'コースを切る', `${sideJ[r.side]}の受け手へのコースが空いていた。ボールと${sideJ[r.side]}の受け手を結ぶ線の上に体を入れながら寄せよう`]);
      // 2. scanning
      const n = r.seen.L + r.seen.R + r.seen.M;
      const missing = [!r.seen.L && '左の受け手', !r.seen.R && '右の受け手', !r.seen.M && '後ろの味方'].filter(Boolean);
      items.push([n === 3 ? 'g' : n === 2 ? 'm' : 'b', '首振り',
        n === 3 ? (r.seenBeforeBall === 3 ? 'ボールが来る前に3人とも見られた' : '3人とも見られた。ボールが来る前に終われるともっと良い')
                : `見ていない：${missing.join('、')}。寄せる前に首を振って確認しよう`]);
      // 3. voice call
      if (!r.call) items.push(['b', '声の指示', `味方に指示がなかった。「${sideJ[other]}いけ！」で反対側をまかせよう`]);
      else if (r.call === r.side) items.push(['b', '声の指示', `「${sideJ[r.side]}」と言ったけど、そっちは自分が切る側。味方には反対の「${sideJ[other]}いけ！」`]);
      else if (r.callT > BALL_TRAVEL + 0.8) items.push(['m', '声の指示', `「${sideJ[other]}いけ」は正しいけど遅い。ボールが来る前に言おう`]);
      else items.push(['g', '声の指示', `「${sideJ[other]}いけ」をいいタイミングで出せた（${r.callBy}）`]);
      // 4. approach
      const d = r.distAtDecision;
      if (r.outcome === 'beaten') items.push(['b', '寄せ', `近くで秒速${r.nearSpeed.toFixed(1)}m。止まれずに飛び込んだ`]);
      else if (d > 4.5) items.push(['b', '寄せ', `相手が判断した時、まだ${d.toFixed(1)}m離れていた。もっと早く寄せよう`]);
      else if (d > 2.8) items.push(['m', '寄せ', `相手が判断した時${d.toFixed(1)}m。あと一歩寄せたい`]);
      else items.push(['g', '寄せ', `相手が判断した時${d.toFixed(1)}m。いい距離まで寄せられた`]);
      return items;
    },
    outcome() {
      const OUT = {
        intercept: ['インターセプト！', 'パスを自分でカットした。'],
        mateCut: ['味方がカット！', '指示どおり味方がパスを奪った。'],
        stuck: ['出しどころを消した！', '両方のコースが消えて、相手は下げるしかなかった。'],
        passed: ['パスを通された', `${sideJ[rep.passTo]}の受け手へのコースが空いていた。` + (rep.passTo === rep.side ? '危ない側を体で切れていなかった。' : '反対側を味方にまかせられていなかった。')],
        beaten: ['かわされた', '勢いよく飛び込みすぎて、逆を取られた。'],
      };
      return OUT[rep.outcome];
    },
    snap() {
      const P = (p, c, s) => [p.pos.x, p.pos.z, c, s];
      return {
        lines: ['L', 'R'].map(k => [holder.pos.x, holder.pos.z, recv[k].pos.x, recv[k].pos.z]),
        gazes: [[holder.pos.x, holder.pos.z, holder.facing + holder.headYaw]],
        dots: [P(holder, '#e2474b'), P(recv.L, '#e2474b'), P(recv.R, '#e2474b'), P(mate, '#3d8bff'), [ball.position.x, ball.position.z, '#ffffff', 0.55]],
        myHalf: 30 * deg,
      };
    },
  };
  function cutDecide() {
    const other = rep.side === 'L' ? 'R' : 'L';
    rep.distAtDecision = distToHolder();
    rep.decision = { blockedMe: { L: laneBlockedByMe('L'), R: laneBlockedByMe('R') }, marked: { L: markedByMate('L'), R: markedByMate('R') } };
    rep.passT = 0;
    if (rep.distAtDecision < 2.0 && rep.nearSpeed > 3.8) { rep.phase = 'beaten'; banner('かわされた！', 1.2); return; }
    const open = [rep.side, other].filter(laneOpen);
    if (open.length) { rep.passTo = open[0]; rep.phase = 'windup'; }
    else { rep.phase = 'stuck'; banner('出しどころなし！', 1.2); }
  }

  // ========== drill 2: keep your mark (defence, no ball-watching) ==========
  // Three attackers pass the ball around in front. Your mark keeps sliding into the space
  // behind your shoulder; it freezes while you look at it. Lose sight of it too long → it runs in behind.
  const MARK_LV = {
    1: { limit: 3.0, speed: 2.6, meter: true, note: 'メーターあり・マークはゆっくり' },
    2: { limit: 2.4, speed: 3.3, meter: true, note: 'メーターあり・マークの動きがふつう' },
    3: { limit: 1.8, speed: 4.0, meter: false, note: 'メーターなし・マークがすばやく背後をねらう' },
  };
  const MARK_TIME = 15, BALL_LOST = 3.5;
  const passers = [holder, recv.L, recv.R];
  function circulate(dt) {
    if (!rep.passTo) {
      const o = rep.owner;
      o.facing = angTo(o.pos, mate.pos); // looking for the pass into your mark
      atFeet(o, 0.45);
      rep.nextPass -= dt;
      if (rep.nextPass <= 0) {
        const opts = passers.filter(p => p !== o);
        rep.passTo = opts[Math.random() * opts.length | 0];
        rep.passFrom = ball.position.clone(); rep.passT = 0;
        o.legs[1].rotation.x = 0.6;
      }
    } else {
      rep.passT += dt;
      const to = rep.passTo.pos, from = rep.passFrom, L = flatDist(from, to), k = Math.min(1, rep.passT * 12 / L);
      ball.position.set(from.x + (to.x - from.x) * k, 0.11, from.z + (to.z - from.z) * k);
      if (k >= 1) { rep.owner = rep.passTo; rep.passTo = null; rep.nextPass = 1.1 + Math.random() * 0.9; }
    }
    passers.forEach(p => { if (p !== rep.owner || rep.passTo) p.facing = angTo(p.pos, ball.position); p.headYaw = 0; });
  }
  function markBreak(kind) {
    rep.phase = 'break'; rep.kind = kind; rep.passT = 0; rep.passFrom = ball.position.clone(); rep.passTo = null;
    rep.run = new THREE.Vector3(clamp(mate.pos.x * 0.7, -15, 15), 0, clamp(Math.max(me.pos.z, mate.pos.z) + 5, 4, 23));
    banner(kind === 'mark' ? '背後を取られた！' : kind === 'ball' ? 'ボールを見失った！' : 'マークがフリー！', 1.2);
  }
  const mark = {
    name: 'マークを外さない', task: 'ボールとマークを交互に見て、ゴール側でマークをケアしよう（15秒）', voice: false, levels: MARK_LV,
    lead: 'あなたはディフェンス。前で相手3人がボールを回しています。近くにいる黄色い名前の「マーク」は、あなたの死角（背中側）に入ろうと動きます。',
    intro: [
      'ボールばかり見ていると、マークに背後を取られる。<b>首を振ってマークを確認</b>しよう',
      'あなたが見ている間、マークは死角に入れない',
      'マークより<b>ゴール側</b>（後ろ）に立って、2〜3mの距離をたもとう',
      'ボールを見なさすぎてもダメ。ボールとマークを<b>交互に</b>見て、15秒守り切ろう',
    ],
    wins: ['held', 'stopped', 'cut'], failBanner: '外された…',
    replayWin: { x0: -16, x1: 16, z0: -6, z1: 24 }, mapWin: { x0: -16, x1: 16, z0: -6, z1: 24 },
    start() {
      passers.forEach(p => setRole(p, RED, '相手', RED_T));
      setRole(mate, RED, 'マーク', '#ffd23f');
      mate.ring.visible = level === 1;
      holder.pos.set((Math.random() - 0.5) * 6, 0, -3);
      recv.L.pos.set(-13, 0, 1 + Math.random() * 3); recv.R.pos.set(13, 0, 1 + Math.random() * 3);
      const side = Math.random() < 0.5 ? -1 : 1;
      me.pos.set(0, 0, 12); me.vel.set(0, 0, 0);
      mate.pos.set(side * 3, 0, 9.5);
      rep = baseRep({
        owner: holder, passTo: null, passFrom: null, passT: 0, nextPass: 1.0 + Math.random() * 0.6,
        side, flipIn: 4 + Math.random() * 2, lostMark: 0, lostBall: 0, maxLost: 0, maxLostBall: 0, checks: 0, wasSeen: true,
        n: 0, goalSide: 0, distSum: 0, kind: null, run: null,
      });
      holder.facing = angTo(holder.pos, mate.pos);
      atFeet(holder, 0.45);
    },
    update(dt) {
      const lv = MARK_LV[level];
      rep.t += dt;
      if (rep.phase === 'live') {
        const seeMark = inMyView(mate.pos, VIEW), seeBall = inMyView(ball.position, VIEW);
        if (seeMark) { if (!rep.wasSeen) rep.checks++; rep.lostMark = 0; } else rep.lostMark += dt;
        rep.wasSeen = seeMark;
        rep.lostBall = seeBall ? 0 : rep.lostBall + dt;
        rep.maxLost = Math.max(rep.maxLost, rep.lostMark); rep.maxLostBall = Math.max(rep.maxLostBall, rep.lostBall);
        const d = flatDist(me.pos, mate.pos);
        rep.n++; rep.distSum += d; if (me.pos.z > mate.pos.z + 0.2) rep.goalSide++;
        circulate(dt);
        // the mark heads for the space behind your shoulder, and swaps shoulders now and then
        if ((rep.flipIn -= dt) <= 0) { rep.side *= -1; rep.flipIn = 3.5 + Math.random() * 2.5; }
        const a = cameraYaw() + Math.PI - rep.side * 0.65;
        const tx = clamp(me.pos.x - Math.sin(a) * 3.0, -20, 20), tz = clamp(me.pos.z - Math.cos(a) * 3.0, -2, 23);
        moveTo(mate.pos, tx, tz, (seeMark ? 0.7 : lv.speed) * dt);
        mate.facing = angTo(mate.pos, ball.position); mate.headYaw = seeMark ? 0 : 0.6 * Math.sin(rep.t * 2.5);
        const left = MARK_TIME - rep.t;
        if (rep.lostMark > lv.limit) markBreak('mark');
        else if (rep.lostBall > BALL_LOST) markBreak('ball');
        else if (left <= 0) { if (me.pos.z > mate.pos.z + 0.2 && d <= 3.5) finish('held'); else markBreak('pos'); }
        const frac = clamp(1 - rep.lostMark / lv.limit, 0, 1);
        $('meterBar').hidden = !lv.meter;
        $('meterFill').style.width = (frac * 100).toFixed(0) + '%';
        $('meterFill').style.background = frac < 0.35 ? 'var(--bad)' : frac < 0.65 ? 'var(--mid)' : 'var(--good)';
        $('meterTime').textContent = '残り' + Math.max(0, Math.ceil(left)) + '秒';
      } else if (rep.phase === 'break') {
        // the mark sprints in behind and the ball is played into its path
        rep.passT += dt;
        moveTo(mate.pos, rep.run.x, rep.run.z, 6.0 * dt);
        mate.facing = angTo(mate.pos, ball.position); mate.headYaw = 0;
        const from = rep.passFrom, L = Math.max(0.1, flatDist(from, rep.run)), k = Math.min(1, rep.passT * 13 / L);
        ball.position.set(from.x + (rep.run.x - from.x) * k, 0.11, from.z + (rep.run.z - from.z) * k);
        passers.forEach(p => { p.facing = angTo(p.pos, ball.position); });
        if (flatDist(ball.position, me.pos) < 0.8) finish('cut');
        else if (flatDist(ball.position, mate.pos) < 0.9) finish(flatDist(me.pos, mate.pos) < 1.4 ? 'stopped' : 'broke');
        else if (rep.passT > 4) finish('broke');
      }
    },
    items() {
      const r = rep, lim = MARK_LV[level].limit, items = [];
      const ml = r.maxLost.toFixed(1), bl = r.maxLostBall.toFixed(1);
      if (r.kind === 'mark') items.push(['b', 'マークの確認', `マークを${lim}秒以上見なかった。ボールを見たら、すぐ首を振ってマークを見よう`]);
      else if (r.maxLost < lim * 0.7) items.push(['g', 'マークの確認', `こまめに確認できた（${r.checks}回・いちばん長く見なかったのは${ml}秒）`]);
      else items.push(['m', 'マークの確認', `マークを最長${ml}秒見なかった（限界${lim}秒）。もう少し早く首を振ろう`]);
      if (r.kind === 'ball') items.push(['b', 'ボールの確認', `ボールを${BALL_LOST}秒以上見なかった。マークを見たら、ボールにも戻ろう`]);
      else if (r.maxLostBall < 2.0) items.push(['g', 'ボールの確認', `ボールも見続けられた（見なかったのは最長${bl}秒）`]);
      else items.push(['m', 'ボールの確認', `ボールを最長${bl}秒見なかった。マークとボールを交互に見よう`]);
      const gs = r.n ? Math.round(r.goalSide / r.n * 100) : 0;
      items.push([gs >= 80 ? 'g' : gs >= 50 ? 'm' : 'b', 'ゴール側に立つ',
        gs >= 80 ? `${gs}%の時間、マークよりゴール側にいられた` : `マークよりゴール側にいたのは${gs}%の時間。マークとゴールの間に立とう`]);
      const ad = r.n ? r.distSum / r.n : 0, ads = ad.toFixed(1);
      if (ad >= 1.5 && ad <= 3.5) items.push(['g', '距離', `マークとの平均距離${ads}m。ちょうどいい`]);
      else if (ad < 1.5) items.push(['m', '距離', `平均${ads}m。近すぎると背中側に回られやすい。2〜3mあけよう`]);
      else if (ad <= 5) items.push(['m', '距離', `平均${ads}m。少し遠い。2〜3mまで近づこう`]);
      else items.push(['b', '距離', `平均${ads}m。離れすぎ。パスが出てもすぐ寄せられる2〜3mに`]);
      return items;
    },
    outcome() {
      const o = rep.outcome;
      if (o === 'held') return ['守り切った！', '15秒間、ボールとマークを交互に見て、ゴール側でマークをケアできた。'];
      if (o === 'stopped') return ['寄せて止めた！', 'マークにパスが出たけど、近くにいたのですぐ止められた。'];
      if (o === 'cut') return ['パスカット！', 'マークへのパスを自分でカットした。'];
      return ['マークに外された', {
        mark: 'ボールばかり見ている間に、マークに背中側へ入られた。',
        ball: 'ボールを見ていない時間が長すぎて、出し手にフリーで狙われた。',
        pos: '最後の時点でマークがフリーだった（ゴール側にいない、または離れすぎ）。',
      }[rep.kind]];
    },
    snap() {
      return {
        dots: [...passers.map(p => [p.pos.x, p.pos.z, '#e2474b']), [mate.pos.x, mate.pos.z, '#ff9f40', 1.15], [ball.position.x, ball.position.z, '#ffffff', 0.55]],
        gazes: [], myHalf: VIEW,
      };
    },
  };

  // ========== drill 3: run in behind (attack, the defender's gaze) ==========
  // You are the forward. The defender's eyes are mostly on the ball, with quick checks toward where
  // he last saw you; he only tracks what he sees. Stand where he can't see you and the ball together,
  // then go on the passer's kick-back.
  const RUN_LV = {
    1: { react: 0.8, check: 2.2, look: 0.5, cone: true, note: 'DFの見ている範囲が地図に出る・DFの反応はおそめ' },
    2: { react: 0.6, check: 1.7, look: 0.6, cone: true, note: 'DFの見ている範囲が地図に出る・反応ふつう' },
    3: { react: 0.45, check: 1.3, look: 0.7, cone: false, note: '地図に表示なし・DFがよく首を振る' },
  };
  const DF_HALF = 55 * deg, HEAD_MAX = 100 * deg, WIND = 0.45, RUN_V = 2.8;
  const run = {
    name: '背後へ飛び出す', task: 'DFの視線の外に立って、味方の足の振り上げに合わせて裏へ飛び出そう', voice: false, levels: RUN_LV,
    lead: 'あなたはフォワード。後ろの味方がボールを持っていて、背中側に相手DFが1人います。DFは首を振って、ボールとあなたを交互に見ています。',
    intro: [
      'まず首を振って、DFの位置と顔の向きを確認しよう',
      'DFの<b>肩の後ろ、ボールと反対側</b>に立つと、DFはボールとあなたを同時に見られない',
      '味方が<b>足を後ろに振り上げた瞬間</b>に、DFの裏（ゴール方向）へ飛び出そう',
      'DFがボールを見ている間に走り出すと、反応が遅れる。早すぎるとオフサイド',
    ],
    wins: ['received'], failBanner: '残念…',
    replayWin: { x0: -14, x1: 14, z0: -4, z1: 25 }, mapWin: { x0: -16, x1: 16, z0: -4, z1: 25 },
    start() {
      setRole(holder, BLUE, '味方（ボール）', BLUE_T); setRole(mate, RED, '相手DF', RED_T);
      bench(recv.L); bench(recv.R);
      holder.pos.set(-6 + Math.random() * 12, 0, -2); holder.facing = 0;
      mate.pos.set((Math.random() - 0.5) * 3, 0, 15.5);
      me.pos.set((Math.random() - 0.5) * 4, 0, 11.5); me.vel.set(0, 0, 0);
      rep = baseRep({
        kickAt: 3.6 + Math.random() * 2.6, windT: null, kickT: null, P: null, bv: null,
        gaze: 0, checkIn: RUN_LV[level].check, checkT: 0, lastSeen: me.pos.clone(), seenT: 0, sawMe: true, dfGo: null,
        runT: null, runSeen: null, sawBall: false, defChecks: 0, wasDef: false, angWind: null, offside: false,
      });
      atFeet(holder, 0.45);
      mate.facing = angTo(mate.pos, ball.position); rep.gaze = mate.facing;
    },
    update(dt) {
      const lv = RUN_LV[level], d = mate; // the "mate" figure plays the defender here
      rep.t += dt;
      const before = !rep.kickT;
      if (before) {
        if (inMyView(ball.position, VIEW)) rep.sawBall = true;
        const sd = inMyView(d.pos, VIEW); if (sd && !rep.wasDef) rep.defChecks++; rep.wasDef = sd;
      }

      // defender's eyes: on the ball, with a check toward where he last saw you (then a search for you)
      const toBall = angTo(d.pos, ball.position);
      let want = toBall;
      // once the passer winds up, his eyes stay on the ball: that is your moment
      if (rep.phase === 'live' && rep.dfGo === null) {
        if (rep.checkT > 0) {
          rep.checkT -= dt;
          want = angTo(d.pos, (rep.checkT < lv.look - 0.25 && !rep.sawMe) ? me.pos : rep.lastSeen);
          if (rep.checkT <= 0) rep.checkIn = lv.check * (0.7 + Math.random() * 0.6);
        } else if ((rep.checkIn -= dt) <= 0) rep.checkT = lv.look;
      }
      rep.gaze = turnToward(rep.gaze, d.facing + clamp(wrap(want - d.facing), -HEAD_MAX, HEAD_MAX), 7 * dt);
      d.headYaw = wrap(rep.gaze - d.facing);
      rep.sawMe = flatDist(d.pos, me.pos) < 1.6 || Math.abs(wrap(angTo(d.pos, me.pos) - rep.gaze)) < DF_HALF;
      if (rep.sawMe) { rep.lastSeen.copy(me.pos); rep.seenT = rep.t; }

      // your run: a burst toward goal. Before the pass, stopping cancels it
      if (before && me.vel.z < 1.0) { rep.runT = null; rep.runSeen = null; }
      if (me.vel.z > RUN_V && rep.runT === null) { rep.runT = rep.t; rep.runSeen = rep.sawMe; }
      // a run he can see, he follows
      if (rep.sawMe && me.vel.z > RUN_V) rep.dfGo = Math.min(rep.dfGo === null ? Infinity : rep.dfGo, rep.t + 0.2);

      // defender's feet
      if (rep.dfGo !== null && rep.t >= rep.dfGo) {
        const tgt = before ? { x: me.pos.x, z: Math.min(22, me.pos.z + 1.2) } : rep.bv.left > 0 ? rep.P : ball.position;
        moveTo(d.pos, tgt.x, tgt.z, 4.4 * dt);
        if (flatDist(d.pos, tgt) > 0.2) d.facing = turnToward(d.facing, angTo(d.pos, tgt), 8 * dt);
      } else if (before) {
        // drops a step goal-side of where he last saw you, a little inside
        moveTo(d.pos, rep.lastSeen.x * 0.5, clamp(rep.lastSeen.z + 1.5, 9, 19), 2.4 * dt);
        d.facing = turnToward(d.facing, toBall, 4 * dt);
      }

      if (rep.phase === 'live') {
        holder.facing = turnToward(holder.facing, 0, 3 * dt); holder.headYaw = 0.6 * Math.sin(rep.t * 2.2);
        atFeet(holder, 0.45);
        if (rep.t >= rep.kickAt - WIND) {
          rep.phase = 'windup'; rep.windT = rep.t;
          rep.angWind = Math.abs(wrap(angTo(d.pos, ball.position) - angTo(d.pos, me.pos))) / deg;
        }
      } else if (rep.phase === 'windup') {
        // the cue: the kicking leg swings back
        holder.legs[1].rotation.x = -0.9 * Math.min(1, (rep.t - rep.windT) / WIND);
        holder.facing = turnToward(holder.facing, angTo(holder.pos, me.pos), 4 * dt); holder.headYaw = 0;
        atFeet(holder, 0.45);
        if (rep.t >= rep.kickAt) {
          rep.phase = 'pass'; rep.kickT = rep.t; holder.legs[1].rotation.x = 0.6;
          rep.offside = me.pos.z > d.pos.z + 0.3;
          const react = rep.t + (rep.t - rep.seenT < 0.3 ? 0.15 : lv.react);
          rep.dfGo = rep.dfGo === null ? react : Math.min(rep.dfGo, react);
          // through ball into the space behind the defender, on your side
          rep.P = new THREE.Vector3(clamp(me.pos.x + me.vel.x * 0.6, -10, 10), 0, clamp(Math.max(d.pos.z, me.pos.z) + 5.5, 12, 24.5));
          const dx = rep.P.x - ball.position.x, dz = rep.P.z - ball.position.z, L = Math.hypot(dx, dz);
          rep.bv = { x: dx / L, z: dz / L, s: 15, left: L, L };
        }
      } else if (rep.phase === 'pass') {
        const since = rep.t - rep.kickT, step = rep.bv.s * dt;
        ball.position.x += rep.bv.x * step; ball.position.z = Math.min(25.5, ball.position.z + rep.bv.z * step);
        rep.bv.left -= step;
        if (rep.bv.left <= 0) rep.bv.s = Math.max(0, Math.min(rep.bv.s, 3) - 2 * dt);
        // a lofted ball over the defender: nobody can touch it until it lands at the spot
        const k = clamp(1 - rep.bv.left / rep.bv.L, 0, 1);
        ball.position.y = 0.11 + 4 * 2.2 * k * (1 - k);
        if (rep.offside) { if (since > 0.6) finish('offside'); return; }
        if (rep.bv.left > 0.3) return;
        const dm = flatDist(me.pos, ball.position), dd = flatDist(d.pos, ball.position);
        if (dm < 1.2 && dm <= dd) finish('received');
        else if (dd < 0.9) finish('cleared');
        else if (since > 5) finish('cleared');
      }
    },
    items() {
      const r = rep, items = [];
      const a = Math.round(r.angWind);
      if (a >= 100) items.push(['g', 'ボールと同時に見せない', `振り上げの時、DFから見てボールとあなたは${a}°はなれていた。同時には見られない位置に立てた`]);
      else if (a >= 65) items.push(['m', 'ボールと同時に見せない', `振り上げの時の角度は${a}°。もう少しDFの肩の後ろ（ボールと反対側）へ`]);
      else items.push(['b', 'ボールと同時に見せない', `振り上げの時の角度は${a}°。DFの前にいて、ボールと一緒に見られていた`]);
      if (r.runT === null) items.push(['b', '視線を盗む', '飛び出しがなかった']);
      else if (!r.runSeen) items.push(['g', '視線を盗む', 'DFがボールを見ている間に走り出せた']);
      else items.push(['b', '視線を盗む', '走り出しをDFに見られていた。DFがボールの方を向いた瞬間に出よう']);
      if (r.offside) items.push(['b', '飛び出しのタイミング', 'パスが出た瞬間にDFより前にいた（オフサイド）。DFと横並びで待って、振り上げで出よう']);
      else if (r.runT === null) items.push(['b', '飛び出しのタイミング', '振り上げに反応できなかった。味方の足が後ろに上がったら合図']);
      else {
        const rt = r.runT - r.windT;
        if (rt < -0.15) items.push(['m', '飛び出しのタイミング', `振り上げより${(-rt).toFixed(1)}秒早く走り出した。早すぎるとDFに読まれる`]);
        else if (rt <= 0.45) items.push(['g', '飛び出しのタイミング', `振り上げから${Math.max(0, rt).toFixed(2)}秒で反応できた`]);
        else if (rt <= 0.8) items.push(['m', '飛び出しのタイミング', `反応まで${rt.toFixed(2)}秒。もう少し早く`]);
        else items.push(['b', '飛び出しのタイミング', `反応まで${rt.toFixed(2)}秒。遅い。振り上げを見たらすぐ`]);
      }
      const sc = (r.defChecks >= 2) + r.sawBall;
      items.push([sc === 2 ? 'g' : sc === 1 ? 'm' : 'b', '首振り',
        sc === 2 ? `パスの前に、DFを${r.defChecks}回とボールを確認できた`
          : !r.sawBall ? 'ボール（味方）を見ていなかった。振り上げはボールを見ていないと分からない'
          : `パスの前にDFを確認したのは${r.defChecks}回。2回以上首を振ろう`]);
      return items;
    },
    outcome() {
      const o = rep.outcome;
      if (o === 'received') return ['抜け出し成功！', 'DFの視線の外から飛び出して、裏へのパスに先にさわれた。'];
      if (o === 'offside') return ['オフサイド', 'パスが出た瞬間に、DFよりゴール側にいた。'];
      return ['DFに先にさわられた', rep.runT === null ? '飛び出さなかったので、DFがボールを拾った。'
        : rep.runSeen ? '飛び出しをDFに見られて、先に戻られた。' : '飛び出しが遅れて、ボールに間に合わなかった。'];
    },
    snap() {
      const g = rep && rep.gaze != null ? rep.gaze : mate.facing;
      return {
        dots: [[holder.pos.x, holder.pos.z, '#3d8bff'], [mate.pos.x, mate.pos.z, '#e2474b'], [ball.position.x, ball.position.z, '#ffffff', 0.55]],
        gazes: [[mate.pos.x, mate.pos.z, g]], cones: [[mate.pos.x, mate.pos.z, g, DF_HALF, 9]], hline: mate.pos.z, myHalf: VIEW,
      };
    },
  };

  const DRILLS = { cut, mark, run };

  // ---------- result ----------
  function showResult() {
    const [title, why] = drill.outcome();
    $('resTitle').textContent = title; $('resWhy').textContent = why;
    $('items').innerHTML = '';
    for (const [m, name, text] of drill.items()) {
      const el = document.createElement('div'); el.className = 'item';
      const mk = document.createElement('div'); mk.className = 'mark ' + m; mk.textContent = m === 'g' ? '○' : m === 'm' ? '△' : '×';
      const tx = document.createElement('div'); const b = document.createElement('b'); b.textContent = name;
      const sm = document.createElement('small'); sm.textContent = text; tx.append(b, sm); el.append(mk, tx);
      $('items').append(el);
    }
    $('result').hidden = false;
    startReplay();
  }
  $('next').addEventListener('click', () => { $('result').hidden = true; stopReplay(); startRep(); });
  $('toMenu').addEventListener('click', () => { $('result').hidden = true; stopReplay(); $('start').hidden = false; $('meter').hidden = true; });

  // ---------- replay (top view) ----------
  const rc = $('replay'), rg = rc.getContext('2d');
  let replayRAF = 0;
  function startReplay() {
    const frames = rep.rec, win = drill.replayWin; let i = 0, acc = 0, last = performance.now();
    const loop = now => {
      acc += now - last; last = now;
      while (acc > 100) { acc -= 100; i++; if (i >= frames.length + 12) i = 0; }
      const k = Math.min(i, frames.length - 1);
      drawTop(rg, rc.width, rc.height, frames[k], win, frames.slice(0, k + 1));
      replayRAF = requestAnimationFrame(loop);
    };
    replayRAF = requestAnimationFrame(loop);
  }
  function stopReplay() { cancelAnimationFrame(replayRAF); }

  // shared top-down renderer (minimap + replay). Frames come from snapshot()
  function drawTop(g, W, H, f, win, trail, opt) {
    const s = Math.min(W / (win.x1 - win.x0), H / (win.z1 - win.z0));
    const ox = (W - (win.x1 - win.x0) * s) / 2, oz = (H - (win.z1 - win.z0) * s) / 2;
    const X = x => ox + (x - win.x0) * s, Y = z => oz + (z - win.z0) * s;
    g.clearRect(0, 0, W, H);
    g.strokeStyle = 'rgba(255,255,255,.3)'; g.lineWidth = 2;
    g.strokeRect(X(-20.15), Y(26 - 16.5), 40.3 * s, 16.5 * s);
    if (!f) return;
    const hideHelp = opt && opt.noHelp;
    (f.lines || []).forEach(([x1, z1, x2, z2]) => { // passing lanes
      g.strokeStyle = 'rgba(255,143,143,.35)'; g.setLineDash([6, 6]); g.beginPath();
      g.moveTo(X(x1), Y(z1)); g.lineTo(X(x2), Y(z2)); g.stroke(); g.setLineDash([]);
    });
    if (f.hline != null && !hideHelp) { // offside line
      g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 1.5; g.setLineDash([4, 5]); g.beginPath();
      g.moveTo(X(win.x0), Y(f.hline)); g.lineTo(X(win.x1), Y(f.hline)); g.stroke(); g.setLineDash([]);
    }
    if (!hideHelp) (f.cones || []).forEach(([x, z, a, h, len]) => { // what an opponent can see
      g.fillStyle = 'rgba(226,71,75,.25)'; g.beginPath(); g.moveTo(X(x), Y(z));
      for (let i = 0; i <= 12; i++) { const b = a - h + 2 * h * i / 12; g.lineTo(X(x + Math.sin(b) * len), Y(z + Math.cos(b) * len)); }
      g.closePath(); g.fill();
    });
    const half = f.myHalf || 30 * deg; // your central view
    const fwd = a => [X(f.me[0] - Math.sin(a) * 9), Y(f.me[1] - Math.cos(a) * 9)];
    g.fillStyle = 'rgba(255,210,63,.28)'; g.beginPath(); g.moveTo(X(f.me[0]), Y(f.me[1]));
    const [ax, ay] = fwd(f.yaw - half), [bx, by] = fwd(f.yaw + half);
    g.lineTo(ax, ay); g.lineTo(bx, by); g.closePath(); g.fill();
    (f.gazes || []).forEach(([x, z, a]) => { // opponents' gaze
      g.strokeStyle = 'rgba(255,143,143,.95)'; g.lineWidth = 2; g.beginPath();
      g.moveTo(X(x), Y(z)); g.lineTo(X(x + Math.sin(a) * 4), Y(z + Math.cos(a) * 4)); g.stroke();
    });
    if (trail && trail.length > 1) {
      g.strokeStyle = 'rgba(255,210,63,.7)'; g.lineWidth = 2; g.beginPath();
      trail.forEach((t, i) => i ? g.lineTo(X(t.me[0]), Y(t.me[1])) : g.moveTo(X(t.me[0]), Y(t.me[1]))); g.stroke();
    }
    const r = Math.max(5, s * 0.45);
    const dot = (x, z, c, k) => { g.fillStyle = c; g.beginPath(); g.arc(X(x), Y(z), r * (k || 1), 0, Math.PI * 2); g.fill(); };
    (f.dots || []).forEach(([x, z, c, k]) => dot(x, z, c, k));
    dot(f.me[0], f.me[1], '#ffd23f', 1.1);
  }
  const mm = $('minimap'), mg = mm.getContext('2d');
  function snapshot() { return Object.assign({ me: [me.pos.x, me.pos.z], yaw: cameraYaw() }, drill.snap()); }

  // ---------- menu ----------
  function startRep() {
    drill.start();
    $('meter').hidden = drillKey !== 'mark';
    needsRecenter = true;
    banner('', 0);
  }
  function selectDrill(k) {

    document.querySelectorAll('[data-drill]').forEach(x => x.classList.toggle('sel', x.dataset.drill === k));
    $('lead').textContent = drill.lead;
    $('intro').innerHTML = drill.intro.map(t => `<li>${t}</li>`).join('');
    $('levelNote').textContent = drill.levels[level].note;
    const tb = document.createElement('b'); tb.textContent = drill.name;
    $('task').replaceChildren(tb, '　' + drill.task);
    $('mic').hidden = !drill.voice;
    syncCalls(); showTally();
    drill.start(); rep.phase = 'ended'; // idle scene behind the start card
    needsRecenter = true;
  }
  document.querySelectorAll('[data-drill]').forEach(b => b.addEventListener('click', () => selectDrill(b.dataset.drill)));
  document.querySelectorAll('[data-level]').forEach(b => b.addEventListener('click', () => {
    level = +b.dataset.level;
    document.querySelectorAll('[data-level]').forEach(x => x.classList.toggle('sel', x === b));
    $('levelNote').textContent = drill.levels[level].note;
  }));

  // ---------- start ----------
  const note = $('note');
  function begin(m) {
    mode = m; $('start').hidden = true;
    $('hint').textContent = m === 'gyro'
      ? '体ごと回って見回す ・ 左でスティック移動 ・ 右ドラッグで向きの微調整'
      : '左でスティック移動 ・ 右をドラッグで見回す';
    try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (_) {}
    if (!rec && drill.voice) startVoice();
    startRep();
  }
  $('startTouch').addEventListener('click', () => begin('touch'));
  $('startGyro').addEventListener('click', async () => {
    note.textContent = '';
    try {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        const r = await DeviceOrientationEvent.requestPermission();
        if (r !== 'granted') throw new Error('denied');
      }
      addEventListener('deviceorientation', onOri);
      const ok = await new Promise(res => { const t0 = performance.now(); (function chk() { if (devOri) return res(true); if (performance.now() - t0 > 1200) return res(false); requestAnimationFrame(chk); })(); });
      if (!ok) throw new Error('no data');
      begin('gyro');
    } catch (err) {
      note.textContent = 'この画面ではジャイロが使えませんでした。今は「タッチ操作で始める」で試してください。';
    }
  });

  // ---------- movement ----------
  function updateMe(dt) {
    let ix = joy.x, iy = joy.y;
    if (keys.KeyA) ix -= 1; if (keys.KeyD) ix += 1; if (keys.KeyW) iy -= 1; if (keys.KeyS) iy += 1;
    const L = Math.hypot(ix, iy); if (L > 1) { ix /= L; iy /= L; }
    const yaw = cameraYaw();
    const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
    const sp = rep.phase === 'ended' ? 0 : MAX_SPEED;
    const tx = (fx * -iy + rx * ix) * sp, tz = (fz * -iy + rz * ix) * sp;
    const a = Math.min(1, dt * 3.5); // acceleration: you can't stop instantly
    me.vel.x += (tx - me.vel.x) * a; me.vel.z += (tz - me.vel.z) * a;
    me.pos.x += me.vel.x * dt; me.pos.z += me.vel.z * dt;
    me.pos.x = Math.max(-FW / 2 + 0.5, Math.min(FW / 2 - 0.5, me.pos.x));
    me.pos.z = Math.max(-FL / 2 + 0.5, Math.min(FL / 2 - 0.5, me.pos.z));
    others.forEach(p => {
      if (!p.active) return;
      const dx = me.pos.x - p.pos.x, dz = me.pos.z - p.pos.z, d = Math.hypot(dx, dz);
      if (d < 0.6 && d > 0.0001) { me.pos.x = p.pos.x + dx / d * 0.6; me.pos.z = p.pos.z + dz / d * 0.6; }
    });
    camera.position.set(me.pos.x, EYE, me.pos.z);
  }

  // ---------- loop ----------
  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();
  selectDrill('cut');
  ball.position.set(0, 0.11, -5.55);
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (rep.phase !== 'ended') {
      drill.update(dt);
      // record for the replay
      rep.recT += dt;
      if (rep.recT >= 0.1 && rep.phase !== 'ended') { rep.recT = 0; rep.rec.push(snapshot()); }
    }
    others.forEach(p => {
      if (p !== holder || rep.phase !== 'windup') p.legs[1].rotation.x *= 0.9;
      if (!p.active) return;
      p.g.position.copy(p.pos); p.g.rotation.y = p.facing; p.head.rotation.y = p.headYaw;
    });
    applyLook();
    updateMe(dt);
    drawTop(mg, mm.width, mm.height, snapshot(), drill.mapWin, null, { noHelp: drillKey === 'run' && !RUN_LV[level].cone });
    if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').hidden = true; }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // hook for automated checks
  window.__drill = {
    me, rep: () => rep, makeCall, setYaw: y => { yawOffset = y; }, keys, cameraYaw, yawTo,
    holder, recv, mate, ball, select: selectDrill, start: startRep, level: l => { level = l; },
  };
})();
</script>
